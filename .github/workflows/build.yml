name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
          - platform: ubuntu-22.04
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tag push -> build and publish a draft GitHub Release with the installers.
      - name: Build and release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: INKWAVE ${{ github.ref_name }}
          releaseBody: |
            INKWAVE — 地盘暴动 桌面版。

            - **Windows**：下载 `.exe`（NSIS 安装包）
            - **Linux**：下载 `.deb`（Debian/Ubuntu）或 `.AppImage`（免安装）

            系统要求：Windows 10+ / Ubuntu 22.04+。
          releaseDraft: true
          prerelease: false

      # Anything else -> build only, keep the bundles as workflow artifacts.
      - name: Build only
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: inkwave-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14